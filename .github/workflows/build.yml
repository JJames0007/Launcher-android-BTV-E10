name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Garantir arquivos em todas as pastas esperadas
        run: |
          mkdir -p src/main/java/com/exemplo/tvlauncher
          mkdir -p app/src/main/java/com/exemplo/tvlauncher

          # Localiza o AndroidManifest.xml onde quer que esteja
          MANIFEST_ORIGIN=$(find . -name "AndroidManifest.xml" | head -n 1)
          echo "Manifest encontrado em: $MANIFEST_ORIGIN"

          if [ -n "$MANIFEST_ORIGIN" ]; then
            # Substitui recursos inexistentes pelos padrões do Android
            sed -i 's/@drawable\/banner/@android:drawable\/sym_def_app_icon/g' "$MANIFEST_ORIGIN"
            sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' "$MANIFEST_ORIGIN"
            sed -i 's/@style\/Theme.TvApp/@android:style\/Theme.DeviceDefault.NoActionBar/g' "$MANIFEST_ORIGIN"

            # Copia (sem apagar o original) para a raiz, src/main e app/src/main
            cp "$MANIFEST_ORIGIN" ./AndroidManifest.xml 2>/dev/null || true
            cp "$MANIFEST_ORIGIN" src/main/AndroidManifest.xml 2>/dev/null || true
            cp "$MANIFEST_ORIGIN" app/src/main/AndroidManifest.xml 2>/dev/null || true
          fi

          # Copia todos os arquivos .kt para as pastas de código sem apagá-los da raiz
          find . -maxdepth 3 -name "*.kt" -exec cp {} src/main/java/com/exemplo/tvlauncher/ \; 2>/dev/null || true
          find . -maxdepth 3 -name "*.kt" -exec cp {} app/src/main/java/com/exemplo/tvlauncher/ \; 2>/dev/null || true

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        run: gradle assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: BTV-E10-Launcher-APK
          path: "**/build/outputs/apk/debug/*.apk"
