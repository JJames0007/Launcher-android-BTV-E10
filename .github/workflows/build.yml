name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Organizar arquivos nas pastas do Android automaticamente
        run: |
          mkdir -p src/main/java/com/exemplo/tvlauncher
          if [ -f "AndroidManifest.xml" ]; then
            sed -i 's/@drawable\/banner/@android:drawable\/sym_def_app_icon/g' AndroidManifest.xml
            sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' AndroidManifest.xml
            sed -i 's/@style\/Theme.TvApp/@android:style\/Theme.DeviceDefault.NoActionBar/g' AndroidManifest.xml
            mv AndroidManifest.xml src/main/
          fi
          mv *.kt src/main/java/com/exemplo/tvlauncher/ 2>/dev/null || true

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK Debug
        run: gradle assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: BTV-E10-Launcher-APK
          path: build/outputs/apk/debug/*.apk
